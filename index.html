<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de productos</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link href="app.css" rel="stylesheet">
</head>
<body>
    <header>
        Catálogo de productos · Ángel Astorga
    </header>
    <div id="offline-message" role="status" hidden>Sin conexión a internet. Se mostrarán los productos guardados, si están disponibles. Los cambios requieren conexión.</div>
    <main>
        <form id="product-form">
            <h2 id="form-title">Nuevo producto</h2>
            <label>Nombre <input name="name" required maxlength="120"></label>
            <label>Descripción <textarea name="description" maxlength="500"></textarea></label>
            <label>Precio <input name="price" type="number" min="0" step="0.01" required></label>
            <label>Existencias <input name="stock" type="number" min="0" step="1" required></label>
            <div class="actions">
                <button id="save-button" type="submit">Agregar producto</button>
                <button id="cancel-button" type="button" hidden>Cancelar edición</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <h2>Catálogo</h2>
        <div id="lista" aria-live="polite"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
